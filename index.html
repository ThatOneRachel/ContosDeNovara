let trilhaFundo = null;
let somAmbiente = null;

// Toca a música principal do jogo (ex: o ruído do ELLON ou música tensa)
function tocarTrilha(caminhoAudio) {
    if (trilhaFundo && trilhaFundo.src.includes(caminhoAudio)) return;
    if (trilhaFundo) trilhaFundo.pause();

    trilhaFundo = new Audio(caminhoAudio);
    trilhaFundo.loop = true;
    trilhaFundo.volume = 0.3; // Volume mais baixo para não atrapalhar a leitura
    
    // Tenta tocar (o navegador pode bloquear até o primeiro clique)
    let playPromise = trilhaFundo.play();
    if (playPromise !== undefined) {
        playPromise.catch(error => console.log("Áudio aguardando interação."));
    }
}

function pararTrilha() {
    if (trilhaFundo) {
        trilhaFundo.pause();
        trilhaFundo = null;
    }
}

// Toca um som de ambiente secundário (ex: barulho de escritório ou lâmpada)
function tocarAmbiente(caminhoAudio) {
    if (somAmbiente && somAmbiente.src.includes(caminhoAudio)) return;
    if (somAmbiente) somAmbiente.pause();

    somAmbiente = new Audio(caminhoAudio);
    somAmbiente.loop = true;
    somAmbiente.volume = 0.5;
    
    let playPromise = somAmbiente.play();
    if (playPromise !== undefined) {
        playPromise.catch(error => console.log("Ambiente aguardando interação."));
    }
}

function pararAmbiente() {
    if (somAmbiente) {
        somAmbiente.pause();
        somAmbiente = null;
    }
}

// Toca efeitos sonoros rápidos (ex: virar página, passos)

    const efeito = new Audio(caminhoAudio);
    efeito.volume = 0.8;

}

    const alteracao = Number(valorAlteracao) || 0;

        aplicar() {
            const base = Math.min(100, Math.max(0, Number(conformidade) || 0));
            const resultado = Math.max(0, Math.min(100, base + alteracao));
            conformidade = resultado;
            return `${resultado}% de conformidade`;
        }
    };
}

        function setTextoHistoria(texto) {
            const el = document.getElementById("texto-historia");
            while (el.firstChild) el.removeChild(el.firstChild);
            const x = el.getAttribute("x");
            texto.split("\n").forEach((linha, i) => {
                const tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                tspan.setAttribute("x", x);
                tspan.setAttribute("dy", i === 0 ? "0" : "14");
                tspan.textContent = linha;
                el.appendChild(tspan);
            });
        }

        // Quebra o texto em linhas de até maxChars caracteres, sem cortar palavras
        function quebrarLinhas(texto, maxChars = 58) {
            const palavras = texto.split(" ");
            const linhas = [];
            let linhaAtual = "";

            palavras.forEach((palavra) => {
                const tentativa = linhaAtual ? linhaAtual + " " + palavra : palavra;
                if (tentativa.length <= maxChars) {
                linhaAtual = tentativa;
                } else {
                if (linhaAtual) linhas.push(linhaAtual);
                linhaAtual = palavra;
                }
            });

                if (linhaAtual) linhas.push(linhaAtual);
                return linhas.join("\n");
        }


        function carregarCena(idDaCena) {

            temporizadoresAtivos.forEach(timer => clearTimeout(timer));
            temporizadoresAtivos = [];
            const cena = historia[idDaCena];

            // --- GERENCIADOR AUTOMÁTICO DE ÁUDIO ---
            if (cena.trilha) tocarTrilha(cena.trilha);

            if (cena.ambiente) tocarAmbiente(cena.ambiente);

            if (!cena) {

            let textoParaMostrar = cena.texto.replace("[TEMPO]", sec);
            
            if (cena.quebraLinha){

            } else {

            }
            const textoConformidade = typeof cena.conformidade === 'string'

            const imgCena = document.getElementById('imagem-cenas');

            imgCena.setAttribute('xlink:href', cena.imagem);

            // 2. Reseta a visibilidade de TODOS os botões para o padrão da cena

            const nav2 = document.getElementById('texto-nav2');

            // 3. A SUPER LÓGICA DO "HUB" (Apenas para as cenas de múltipla escolha)

                    if (conversouMarcos) nav2.setAttribute("display", "none");

        // Aplica/remove o filtro grayscale em cada card de personagem da cena 28,
        // de acordo com quem já foi conversado.
        function atualizarGridPersonagens() {
            const mapa = [
                { id: "img-marcos", conversou: conversouMarcos },
                { id: "img-tomas", conversou: conversouTomas },
                { id: "img-dora", conversou: conversouDora },
                { id: "img-donaIeda", conversou: conversouDonaIeda },
                { id: "img-cleo", conversou: conversouCleo }
            ];

            mapa.forEach(function(item) {
                const img = document.getElementById(item.id);
                if (!img) return;
                if (item.conversou) {
                    img.setAttribute("filter", "url(#grayscale-filter)");
                } else {
                    img.removeAttribute("filter");
                }

                if (contatorPessoas >= 3) {
                    img.setAttribute("filter", "url(#grayscale-filter)");
                }
            });
        }

        // 4. A Função de Navegação Refinada
        function fazerEscolha(opcaoEscolhida) {
            const cenaAtual = historia[cenaAtualId];
            let proximaCenaId;

            // Checa as opções adicionais primeiro
            if (opcaoEscolhida === 1 && cenaAtual.destinoNav2) {
                proximaCenaId = cenaAtual.destinoNav2;
            } else if (opcaoEscolhida === 2 && cenaAtual.destinoNav3 ) {
                proximaCenaId = cenaAtual.destinoNav3;
            } else if (opcaoEscolhida === 3 && cenaAtual.destinoNav4) {
                proximaCenaId = cenaAtual.destinoNav4;
            } else if (opcaoEscolhida === 4 && cenaAtual.destinoNav5) {
                proximaCenaId = cenaAtual.destinoNav5;
            } 
            // Checa a opção 1 principal (A Dora, ou o "Voltar para casa")
            else if (cenaAtual.destinoNav) {
                proximaCenaId = cenaAtual.destinoNav;
            } 
            // Se nenhuma das de cima for verdade, segue o modo linear (+1)
            else {
                const numeroAtual = parseInt(cenaAtualId.replace("cena", ""));
                proximaCenaId = "cena" + (numeroAtual + 1);
            }

            cenaAtualId = proximaCenaId;
            carregarCena(cenaAtualId);
        }

            let sec = 30;
            let timer = null;

            // 1. Dá o "Play" nos 30 segundos
            function iniciarTimerQuiz() {
                if (timer) return; // Evita bugar se clicar duas vezes
                
                sec = 30; // Reseta o tempo toda vez que o quiz começa!
                atualizarRelogioNaTela();

                timer = setInterval(function(){
                    sec--;
                    atualizarRelogioNaTela();
                    
                    if (sec <= 0) {
                        pararTimerQuiz();
                        cenaAtualId = "cena71";
                        carregarCena(cenaAtualId);
                    }
                }, 1000);
            }

            // 2. Atualiza a tela redesenhando a frase com os novos segundos
            function atualizarRelogioNaTela() {
                const cena = historia[cenaAtualId];
                if (!cena) return;

                // Troca a palavra [TEMPO] no texto pelo número atual
                let textoAtualizado = cena.texto.replace("[TEMPO]", sec);

                // Manda desenhar de novo no SVG
                if (cena.quebraLinha){
                    setTextoHistoria(quebrarLinhas(textoAtualizado, cena.quebraLinha));
                } else {
                    setTextoHistoria(quebrarLinhas(textoAtualizado));
                }
            }

            // 3. Pausa/Desliga o cronômetro
            function pararTimerQuiz() {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
            }

            function piscarTela() {
                var opacity = 0.1;
                const imagemCena = document.getElementById("imagem-cenas");

                imagemCena.style.opacity = opacity;
                var telaTimer = setInterval(function() {
                    opacity += 0.1;
                    imagemCena.style.opacity = opacity;
                    if (opacity >= 1) {
                        clearInterval(telaTimer);
                    }
                }, 100);

                setTimeout(function() {
                    imagemCena.style.opacity = 1; 
                    cenaAtualId = "cena74"; 
                    carregarCena(cenaAtualId);
                }, 1200); 
            }

            function trocarTela() {
                setTimeout(function() {
                    cenaAtualId = "cena82"
                    carregarCena(cenaAtualId)
                }, 2500)
            }

function matarELLON() {
